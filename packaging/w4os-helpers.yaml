# The web helpers of an OpenSimulator grid, built by dev/build.sh (or apt-package) from build/w4os-helpers, prepared
# by packaging/build. ${VERSION} comes from build-tools.
# A Slim 4 application in /usr/share/w4os-helpers, to be served by a web server (nothing is enabled by installing it): the
# document root is its public folder, whose index.php is the single entry. Its settings are the config of the grid (Robust.ini,
# OpenSim.ini, Helpers.ini), read by the engine. The projects of the family it needs are their own packages (w4os-engine,
# opensim-rest-php), linked into its vendor folder.
name: w4os-helpers
arch: all
platform: linux
version: ${VERSION}
version_schema: semver
section: web
priority: optional
maintainer: Gudule Lapointe <gudule@speculoos.world>
description: |-
  Web helpers of an OpenSimulator grid (economy, search, offline messages)
  PHP scripts the viewers and the simulators query (economy, search, guide,
  offline messages, message of the day) and the home and splash pages, installed
  in /usr/share/w4os-helpers, to be served by a web server.
homepage: https://github.com/way4os/w4os-helpers
license: AGPL-3.0-or-later

depends:
  # Every w4os-engine has what the helpers call (the namespace W4OS\Engine)
  - w4os-engine
  - opensim-rest-php
  - php-curl
  - php-intl
  - php-mbstring
  - php-mysql
  - php-xml
# The name of before w4os, an empty package now (opensim-helpers.yaml)
replaces:
  - opensim-helpers (<< ${DEB_VERSION})
suggests:
  - caddy | nginx | apache2
  - php-fpm | libapache2-mod-php
  - php-imagick

contents:
  - src: packaging/w4os-helpers.copyright
    dst: /usr/share/doc/w4os-helpers/copyright
    file_info:
      mode: 0644
  - src: build/w4os-helpers
    dst: /usr/share/w4os-helpers
    type: tree
  - src: /usr/share/w4os-engine
    dst: /usr/share/w4os-helpers/vendor/w4os/w4os-engine
    type: symlink
  - src: /usr/share/opensim-rest-php
    dst: /usr/share/w4os-helpers/vendor/magicoli/opensim-rest-php
    type: symlink

scripts:
  postinstall: packaging/w4os-helpers.postinst

deb:
  breaks:
    - opensim-helpers (<< ${DEB_VERSION})
