# The name of the helpers before w4os: an empty package that brings w4os-helpers on an upgrade, dropped after one release.
name: opensim-helpers
arch: all
platform: linux
version: ${VERSION}
version_schema: semver
section: oldlibs
priority: optional
maintainer: Gudule Lapointe <gudule@speculoos.world>
description: |-
  transitional package for w4os-helpers
  The web helpers of an OpenSimulator grid are w4os-helpers now. This empty
  package brings it on an upgrade; it can be removed.
homepage: https://github.com/way4os/w4os-helpers
license: AGPL-3.0-or-later

depends:
  - w4os-helpers (= ${DEB_VERSION})

contents:
  - src: packaging/w4os-helpers.copyright
    dst: /usr/share/doc/opensim-helpers/copyright
    file_info:
      mode: 0644
