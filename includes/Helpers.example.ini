; Helpers.ini: what the helpers need and OpenSim.ini and Robust.ini have no place for. Copy it as
; /etc/opensim/grids/<grid>/Helpers.ini (the folder of the grid, where its Robust config is) and edit it.
;
; The format is the one of OpenSimulator. The settings that have an official place (the name of the grid, its addresses,
; the message of the day, the databases of Robust and of its services, the addresses of the search, the registration and the
; offline messages in OpenSim.ini, the economy module and Gloebit) are read from OpenSim.ini and Robust.ini, not from here: see README.md. This file may hold
; any of them, in the same sections, for a web host that has no OpenSimulator (a reduced copy), but what the other files say
; wins over it.
;
; Like every ini file of the grid it may hold passwords: mode 640, group of the web server.
; With several grids on the machine, the web server gives the nick of the one to serve in OPENSIM_GRID.

[Helpers]
; The destinations of the guide: a file (looked for in the folder of the grid) or a URL, "Name|Region URL" lines, a name
; alone starts a category
; GuideSource = "destinations.txt"
; The registry of the search (parcels, hosts, events...): Robust's database unless it has its own
; SearchConnectionString = "Data Source=localhost;Database=ossearch;User ID=opensim;Password=*****;"
; HYPEvents, the calendar the events are read from
; HypEventsURL = "https://2do.directory/events"
; Whatever this folder holds (templates/, assets/) replaces the files of the helpers (the theme folder of the grid by default)
; ThemePath = "theme"
; LogoURL = "https://yourgrid.org/logo.png"
; MailSender = "no-reply@yourgrid.org"
; Set to false when the helpers are included in a larger project (the default is UTC)
; UseUTCTime = true
; The secret that ties a quote of currency to its purchase: MoneyScriptAccessKey of [MoneyServer] (MoneyServer.ini) when the grid
; has one, else this, else a key of the grid's own made of the password of its database
; ScriptKey = "a secret"
